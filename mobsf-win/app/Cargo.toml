[package]
name = "mobsf-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MobSF-Win: a Windows desktop (C/S, single-exe) port of MobSF static analysis"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mobsf-engine = { path = "../engine" }
serde = { workspace = true }
serde_json = "1"

[features]
# Canonical Tauri production switch. `tauri/build.rs` does
# `dev = !custom_protocol`, so WITHOUT this feature the build is treated as a
# dev build, the frontend is not embedded, and the WebView navigates to
# `build.devUrl` instead of the bundled assets. A standalone binary must be
# built with `--features custom-protocol` (what the Tauri CLI does for you).
custom-protocol = ["tauri/custom-protocol"]
